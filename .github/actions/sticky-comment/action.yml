name: Sticky comment
description: Create or update a single pull request comment from a markdown string or file.

inputs:
  marker:
    description: Hidden marker used to find and update the existing comment.
    required: true
  body:
    description: Markdown body. Ignored when body-file is set.
    required: false
    default: ""
  body-file:
    description: Path to a markdown file holding the body.
    required: false
    default: ""
  token:
    description: Token used to read and write the comment.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Upsert PR comment
      uses: actions/github-script@v9
      env:
        MARKER: ${{ inputs.marker }}
        BODY: ${{ inputs.body }}
        BODY_FILE: ${{ inputs.body-file }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const fs = require('node:fs');
          const marker = process.env.MARKER;
          const file = process.env.BODY_FILE;
          const raw = file ? fs.readFileSync(file, 'utf8') : process.env.BODY;

          if (!raw || !raw.trim()) {
            core.setFailed('sticky-comment needs either body or body-file');
            return;
          }

          const body = raw.includes(marker) ? raw : `${marker}\n${raw}`;
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;

          const comments = await github.paginate(github.rest.issues.listComments, {
            owner,
            repo,
            issue_number,
            per_page: 100,
          });
          const existing = comments.find((comment) => comment.body?.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }
