name: PR Title

on:
  workflow_call:
    inputs:
      command:
        description: Command the PR title is piped into.
        required: false
        type: string
        default: pnpm exec commitlint
      node-version:
        required: false
        type: string
        default: "22"
      package-manager:
        description: pnpm, npm or yarn.
        required: false
        type: string
        default: pnpm
      pnpm-version:
        description: Leave empty to read it from the packageManager field.
        required: false
        type: string
        default: ""
      runs-on:
        required: false
        type: string
        default: ubuntu-latest

jobs:
  commitlint:
    name: Commitlint
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v7

      - uses: KostaD02/ci/.github/actions/setup@main
        with:
          node-version: ${{ inputs.node-version }}
          package-manager: ${{ inputs.package-manager }}
          pnpm-version: ${{ inputs.pnpm-version }}

      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | ${{ inputs.command }}
