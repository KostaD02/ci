name: Lint

on:
  workflow_call:
    inputs:
      run:
        description: Lint command.
        required: false
        type: string
        default: pnpm run lint
      node-version:
        required: false
        type: string
        default: "22"
      package-manager:
        description: pnpm, npm or yarn.
        required: false
        type: string
        default: pnpm
      pnpm-version:
        description: Leave empty to read it from the packageManager field.
        required: false
        type: string
        default: ""

jobs:
  lint:
    uses: KostaD02/ci/.github/workflows/node-run.yml@v1
    with:
      name: Lint
      run: ${{ inputs.run }}
      node-version: ${{ inputs.node-version }}
      package-manager: ${{ inputs.package-manager }}
      pnpm-version: ${{ inputs.pnpm-version }}
