name: Self-test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  setup:
    name: Setup action
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        id: setup

      - name: Toolchain works
        id: toolchain
        run: |
          {
            echo "node=$(node --version)"
            echo "pnpm=$(pnpm --version)"
            echo "commitlint=$(pnpm exec commitlint --version)"
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/sticky-comment
        with:
          marker: "<!-- ci-selftest -->"
          body: |
            ## Self-test

            | Tool | Version |
            | --- | --- |
            | Node | ${{ steps.toolchain.outputs.node }} |
            | pnpm | ${{ steps.toolchain.outputs.pnpm }} |
            | commitlint | ${{ steps.toolchain.outputs.commitlint }} |

            node_modules cache: ${{ steps.setup.outputs.cache-hit == 'true' && 'hit' || 'miss' }}

            Build N${{ github.event.pull_request.commits }} for commit ${{ github.event.pull_request.head.sha }}. Updated in place on every push.

  pr-title:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr-title.yml

  format:
    uses: ./.github/workflows/format.yml

  lint:
    uses: ./.github/workflows/lint.yml

  typecheck:
    uses: ./.github/workflows/typecheck.yml

  test:
    uses: ./.github/workflows/test.yml

  hub:
    uses: ./.github/workflows/ci.yml

  build:
    uses: ./.github/workflows/node-build.yml
    with:
      name: Build
      run: mkdir -p dist && cp README.md dist/
      artifact-path: dist

  artifact:
    if: github.event_name == 'pull_request'
    needs: [build]
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/pr-artifact.yml
    with:
      internal-artifact: ${{ needs.build.outputs.artifact }}
      prefix: ci
      size-table: files

  pages:
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/pages-preview.yml
    with:
      name: Pages
      run: mkdir -p dist && sed "s#__BASE__#$SITE_BASE#g" site/index.html > dist/index.html
      folder: dist
      base-path-env: SITE_BASE
      preview-comment: true

  node-run:
    uses: ./.github/workflows/node-run.yml
    with:
      # ? wrappers call node-run@main, so only this job runs the version from the PR
      name: Node run
      run: |
        pnpm run format:check
        pnpm run lint
        pnpm run typecheck
        pnpm run test
